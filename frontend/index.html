<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion RecoSys</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4df;
    --text: #1a1815;
    --muted: #9c9690;
    --accent: #c4a882;
    --accent-dark: #8c7355;
    --saved: #e8f5e9;
    --saved-border: #a5d6a7;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 60px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; letter-spacing: 0.05em; }
  .logo span { font-style: italic; color: var(--accent-dark); }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-id { font-size: 11px; color: var(--muted); font-family: monospace; }

  .saved-tab {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: none; font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .saved-tab:hover { border-color: var(--accent); color: var(--text); }
  .saved-tab.active { background: var(--saved); border-color: var(--saved-border); color: #2e7d32; }
  .saved-count {
    background: var(--accent-dark); color: white; font-size: 10px; font-weight: 500;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .search-section { padding: 2.5rem 2rem 1.5rem; max-width: 700px; margin: 0 auto; }
  .search-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; margin-bottom: 6px; }
  .search-title em { font-style: italic; color: var(--accent-dark); }
  .search-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }

  .search-row { display: flex; gap: 8px; }
  .search-input {
    flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 14px;
    background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .search-btn {
    padding: 12px 24px; background: var(--text); color: white;
    border: none; border-radius: 8px; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
  }
  .search-btn:hover { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .filters {
    max-width: 1200px; margin: 0 auto; padding: 0 2rem 1rem;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; color: var(--muted);
    cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--text); border-color: var(--text); color: white; }

  .grid-section { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; }
  .grid-meta { font-size: 12px; color: var(--muted); margin-bottom: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.3s ease both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .card.saved { border-color: var(--saved-border); }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #f0ede8; display: block; }

  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 13px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }

  .score-bar { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
  .score-fill { height: 100%; background: var(--accent-dark); border-radius: 2px; transition: width 0.6s ease; }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; }
  .card-score { font-size: 11px; color: var(--muted); }
  .card-score span { color: var(--accent-dark); font-weight: 500; }

  .save-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 14px; display: flex;
    align-items: center; justify-content: center; transition: all 0.15s;
  }
  .save-btn:hover { border-color: var(--accent); transform: scale(1.1); }
  .save-btn.saved { background: var(--saved); border-color: var(--saved-border); }

  .loading { display: flex; gap: 5px; padding: 3rem; justify-content: center; }
  .ld { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: ld 1.2s infinite; }
  .ld:nth-child(2){ animation-delay:.2s } .ld:nth-child(3){ animation-delay:.4s }
  @keyframes ld { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

  .placeholder { text-align: center; padding: 4rem 2rem; color: var(--muted); grid-column: 1/-1; }
  .placeholder-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
  .placeholder-text { font-size: 14px; }

  #savedPanel { display: none; }
  #savedPanel.visible { display: block; }
  #mainPanel.hidden { display: none; }

  .saved-header { max-width: 1200px; margin: 0 auto; padding: 2rem 2rem 1rem; }
  .saved-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 400; }
  .saved-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">Fashion <span>RecoSys</span></div>
  <div class="header-right">
    <span class="user-id" id="userIdDisplay"></span>
    <button class="saved-tab" id="savedTab" onclick="toggleSavedPanel()">
      ♡ Saved
      <span class="saved-count" id="savedCount">0</span>
    </button>
  </div>
</header>

<div id="mainPanel">
  <div class="search-section">
    <h1 class="search-title">Find your next <em>favourite piece</em></h1>
    <p class="search-sub">Describe what you're looking for in natural language</p>
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text"
        placeholder="e.g. casual blue shirt for men, summer dress, sports shoes..."
        onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="search-btn" id="searchBtn" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('Apparel', this)">Apparel</button>
    <button class="filter-btn" onclick="setFilter('Accessories', this)">Accessories</button>
    <button class="filter-btn" onclick="setFilter('Footwear', this)">Footwear</button>
    <button class="filter-btn" onclick="setFilter('Personal Care', this)">Personal Care</button>
    <button class="filter-btn" onclick="setFilter('Sporting Goods', this)">Sporting Goods</button>
  </div>

  <div class="grid-section">
    <div id="loadingDiv" style="display:none;">
      <div class="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
    </div>
    <div id="gridMeta" class="grid-meta"></div>
    <div id="productsGrid" class="grid">
      <div class="placeholder">
        <div class="placeholder-icon">✦</div>
        <div class="placeholder-text">Search for something to see recommendations</div>
      </div>
    </div>
  </div>
</div>

<div id="savedPanel">
  <div class="saved-header">
    <h2>Saved items</h2>
    <p id="savedSubtitle"></p>
  </div>
  <div class="grid-section">
    <div id="loadingSaved" style="display:none;">
      <div class="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
    </div>
    <div id="savedGrid" class="grid"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

// ── user_id: gerado uma vez, salvo no localStorage ────────────────
// O produto salvo fica no BANCO DE DADOS do servidor, associado a esse id
function getOrCreateUserId() {
  let id = localStorage.getItem('fashion_user_id');
  if (!id) {
    id = 'user_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('fashion_user_id', id);
  }
  return id;
}

const USER_ID = getOrCreateUserId();
document.getElementById('userIdDisplay').textContent = USER_ID;

let savedIds = new Set(); // IDs dos produtos salvos (para checar rápido)
let lastResults = [];
let activeFilter = 'all';
let showingSaved = false;

// Carrega salvos do servidor ao iniciar
carregarSalvos();

// ── Busca ─────────────────────────────────────────────────────────
async function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  document.getElementById('searchBtn').disabled = true;
  document.getElementById('loadingDiv').style.display = 'block';
  document.getElementById('productsGrid').innerHTML = '';
  document.getElementById('gridMeta').textContent = '';

  try {
    const res = await fetch(`${API}/recomendar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, user_id: USER_ID, top_k: 24, categoria: 'all' })
    });
    const data = await res.json();
    lastResults = data.resultados;
    renderGrid();
  } catch {
    document.getElementById('productsGrid').innerHTML = `
      <div class="placeholder">
        <div class="placeholder-icon">⚠</div>
        <div class="placeholder-text">Could not connect to API. Make sure uvicorn is running.</div>
      </div>`;
  }

  document.getElementById('loadingDiv').style.display = 'none';
  document.getElementById('searchBtn').disabled = false;
}

// ── Renderiza grid ────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('productsGrid');
  const meta = document.getElementById('gridMeta');

  const filtered = activeFilter === 'all'
    ? lastResults
    : lastResults.filter(p => p.masterCategory === activeFilter);

  meta.textContent = `${filtered.length} results`;

  if (!filtered.length) {
    grid.innerHTML = '<div class="placeholder"><div class="placeholder-icon">◌</div><div class="placeholder-text">No results for this filter</div></div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach((produto, i) => grid.appendChild(makeCard(produto, i)));
}

// ── Cria card ─────────────────────────────────────────────────────
function makeCard(produto, i = 0) {
  const isSaved = savedIds.has(produto.id);
  const div = document.createElement('div');
  div.className = `card${isSaved ? ' saved' : ''}`;
  div.id = `card-${produto.id}`;
  div.style.animationDelay = `${i * 40}ms`;

  const score = produto.score || 0;

  div.innerHTML = `
    <img class="card-img" src="${produto.link}" alt="${produto.productDisplayName}"
      onerror="this.src='https://placehold.co/300x400/f0ede8/9c9690?text=No+Image'" />
    <div class="card-body">
      <div class="card-name">${produto.productDisplayName}</div>
      <div class="card-tags">
        <span class="card-tag">${produto.articleType}</span>
        <span class="card-tag">${produto.baseColour}</span>
        <span class="card-tag">${produto.usage}</span>
      </div>
      ${score ? `<div class="score-bar"><div class="score-fill" id="fill-${produto.id}" style="width:0%"></div></div>` : ''}
      <div class="card-bottom">
        <div class="card-score">${score ? `<span>${score}%</span> match` : ''}</div>
        <button class="save-btn ${isSaved ? 'saved' : ''}" id="btn-${produto.id}"
          onclick="toggleSave(${produto.id})">${isSaved ? '♥' : '♡'}</button>
      </div>
    </div>
  `;

  if (score) {
    requestAnimationFrame(() => {
      setTimeout(() => {
        const fill = document.getElementById(`fill-${produto.id}`);
        if (fill) fill.style.width = score + '%';
      }, 60 + i * 30);
    });
  }

  return div;
}

// ── Salvar / remover — agora vai para o banco de dados ────────────
async function toggleSave(productId) {
  // Chama a API — ela faz o toggle automaticamente (salva ou remove)
  const res = await fetch(`${API}/salvos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: USER_ID, product_id: productId })
  });
  const data = await res.json();

  // Atualiza o Set local
  if (data.status === 'salvo') {
    savedIds.add(productId);
  } else {
    savedIds.delete(productId);
  }

  // Atualiza visual do card
  const card = document.getElementById(`card-${productId}`);
  const btn = document.getElementById(`btn-${productId}`);
  if (card) card.classList.toggle('saved', data.status === 'salvo');
  if (btn) {
    btn.classList.toggle('saved', data.status === 'salvo');
    btn.textContent = data.status === 'salvo' ? '♥' : '♡';
  }

  updateSavedCount();
  if (showingSaved) renderSavedPanel();
}

// ── Carrega salvos do servidor ────────────────────────────────────
async function carregarSalvos() {
  try {
    const res = await fetch(`${API}/salvos/${USER_ID}`);
    const data = await res.json();
    savedIds = new Set(data.salvos.map(p => p.id));
    updateSavedCount();
  } catch {
    // API offline, tudo bem
  }
}

function updateSavedCount() {
  document.getElementById('savedCount').textContent = savedIds.size;
}

// ── Painel de salvos ──────────────────────────────────────────────
async function toggleSavedPanel() {
  showingSaved = !showingSaved;
  document.getElementById('savedPanel').classList.toggle('visible', showingSaved);
  document.getElementById('mainPanel').classList.toggle('hidden', showingSaved);
  document.getElementById('savedTab').classList.toggle('active', showingSaved);
  if (showingSaved) await renderSavedPanel();
}

async function renderSavedPanel() {
  const grid = document.getElementById('savedGrid');
  const subtitle = document.getElementById('savedSubtitle');

  document.getElementById('loadingSaved').style.display = 'block';
  grid.innerHTML = '';

  const res = await fetch(`${API}/salvos/${USER_ID}`);
  const data = await res.json();

  document.getElementById('loadingSaved').style.display = 'none';
  subtitle.textContent = `${data.total} item${data.total !== 1 ? 's' : ''} saved`;

  if (!data.salvos.length) {
    grid.innerHTML = '<div class="placeholder"><div class="placeholder-icon">♡</div><div class="placeholder-text">No saved items yet. Search and click ♡ to save.</div></div>';
    return;
  }

  data.salvos.forEach((produto, i) => grid.appendChild(makeCard(produto, i)));
}

// ── Filtro ────────────────────────────────────────────────────────
function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (lastResults.length) renderGrid();
}
</script>
</body>
</html>
