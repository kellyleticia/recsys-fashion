[project]
name = "recsys-fashion"
version = "0.1.0"
description = "Sistema de recomendação de moda com busca semântica usando embeddings e FAISS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.13.0",
    "fastapi>=0.128.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "uvicorn>=0.39.0",
]
